<title>Ilegalísimo Terminal</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
  /* Terminal de mesa de trading: oscuro por diseño (un parquet no se mira en claro).
     Elevación por color de superficie, color saturado solo para significado
     (sube/baja/estado), cifras en monoespaciada tabular. */
  :root{
    color-scheme: dark;
    --bg:#0a0e17; --surface:#111a2b; --surface2:#0d1420; --raised:#16223a;
    --line:#1e2a42; --fg:#e8edf6; --muted:#8694ad; --faint:#5a6680;
    --accent:#ffb000;              /* ámbar de terminal (marca, acentos) */
    --up:#36d07f; --down:#ff5f56; --warn:#ffb020; --chart:#5aa9ff;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
    --sans:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
    --r:7px;
  }
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;line-height:1.45;
       margin:0;-webkit-font-smoothing:antialiased}
  .wrap{padding-inline:16px;padding-block:0;max-width:1480px;margin:0 auto}
  h1,h2,h3{margin:0;font-weight:600;text-wrap:balance}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--muted)} .accent{color:var(--accent)}
  a{color:var(--chart);text-decoration:none}

  /* ---- barra superior ---- */
  .top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:linear-gradient(180deg,#0c1322,#0a0e17);
       border-bottom:1px solid var(--line)}
  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;max-width:1480px;margin:0 auto}
  .brand{display:flex;align-items:baseline;gap:9px}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);align-self:center}
  .brand b{font-family:var(--mono);font-weight:700;letter-spacing:.14em;font-size:15px;color:var(--accent)}
  .brand span{color:var(--faint);font-size:11px;letter-spacing:.22em;text-transform:uppercase}
  .topmeta{margin-left:auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:12px}
  .status{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-weight:600;
          font-size:11px;letter-spacing:.06em}
  .status .led{width:7px;height:7px;border-radius:50%}
  .st-open{background:rgba(54,208,127,.12);color:var(--up)} .st-open .led{background:var(--up);box-shadow:0 0 8px var(--up)}
  .st-closed{background:rgba(134,148,173,.12);color:var(--muted)} .st-closed .led{background:var(--muted)}

  /* ---- cinta de mercado ---- */
  .tape{overflow:hidden;border-bottom:1px solid var(--line);background:var(--surface2)}
  .tape-track{display:inline-flex;gap:30px;padding:7px 0;white-space:nowrap;animation:scroll 60s linear infinite}
  .tape:hover .tape-track{animation-play-state:paused}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .tk{font-family:var(--mono);font-size:12px}
  .tk b{color:var(--fg);font-weight:600;margin-right:7px} .tk .px{color:var(--muted);margin-right:7px}

  /* ---- KPIs ---- */
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px}
  .kpi .lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
  .kpi .val{font-family:var(--mono);font-size:20px;font-weight:600;margin-top:4px}
  .kpi .sub{font-family:var(--mono);font-size:11px;margin-top:2px}

  /* ---- grid principal ---- */
  .grid{display:grid;grid-template-columns:2fr 1fr;gap:12px;align-items:start}
  .col{display:flex;flex-direction:column;gap:12px;min-width:0}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
  .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line)}
  .ph h3{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .ph .tag{font-family:var(--mono);font-size:11px;color:var(--faint)}
  .pb{padding:12px 13px}

  /* verdict pill */
  .pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:20px;font-weight:700;
        font-size:11px;letter-spacing:.08em;font-family:var(--mono)}
  .pill .led{width:7px;height:7px;border-radius:50%}
  .p-GO{background:rgba(54,208,127,.14);color:var(--up)} .p-GO .led{background:var(--up);box-shadow:0 0 8px var(--up)}
  .p-REDUCE{background:rgba(255,176,32,.14);color:var(--warn)} .p-REDUCE .led{background:var(--warn)}
  .p-HALT{background:rgba(255,95,86,.16);color:var(--down)} .p-HALT .led{background:var(--down);box-shadow:0 0 8px var(--down)}

  /* tablas */
  table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums}
  th{text-align:right;color:var(--faint);font-weight:500;font-size:10px;letter-spacing:.08em;text-transform:uppercase;
     padding:6px 8px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
  th:first-child,td:first-child{text-align:left}
  td{padding:6px 8px;border-bottom:1px solid rgba(30,42,66,.5)}
  tbody tr:hover{background:var(--raised)}
  .bk{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);padding:1px 6px;
      border:1px solid var(--line);border-radius:4px}
  .scroll{max-height:340px;overflow:auto}
  .tblwrap{overflow-x:auto}

  /* métricas en lista */
  .rows{display:flex;flex-direction:column;gap:7px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px;font-family:var(--mono);font-size:12px}
  .row .k{color:var(--muted)} .row .v{font-weight:600}
  .bar{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

  /* noticias */
  .news{display:flex;flex-direction:column}
  .ni{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid rgba(30,42,66,.5)}
  .ni:last-child{border-bottom:0}
  .ni .sdot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex:0 0 auto;background:var(--muted)}
  .ni .tt{font-size:12.5px;line-height:1.4;color:var(--fg)}
  .ni .mt{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap}
  .ni .sym{color:var(--accent);font-weight:600}

  /* monitor de mercado */
  .mkt{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
  .mcell{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
  .mcell .n{font-size:11px;color:var(--muted)} .mcell .p{font-family:var(--mono);font-size:16px;font-weight:600;margin-top:3px}
  .mcell .c{font-family:var(--mono);font-size:12px;margin-top:2px}

  .foot{color:var(--faint);font-size:11px;text-align:center;padding:18px 0 26px;font-family:var(--mono)}
  svg .gridline{stroke:var(--line);stroke-width:1}
  @media (prefers-reduced-motion:reduce){.tape-track{animation:none}}
  @media (max-width:1040px){.kpis{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.mkt{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}.mkt{grid-template-columns:repeat(2,1fr)}.topmeta{width:100%;margin-left:0}}
</style>

<div class="top">
  <div class="topbar">
    <div class="brand"><span class="dot"></span><b>ILEGALÍSIMO</b><span>terminal · cuenta paper</span></div>
    <div class="topmeta">
      <span id="clock" class="muted"></span>
      <span id="status"></span>
    </div>
  </div>
  <div class="tape"><div class="tape-track" id="tape"></div></div>
</div>

<div class="wrap">
  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="col">
      <div class="panel">
        <div class="ph"><h3>Curva de equity vs S&amp;P 500</h3><span class="tag" id="curvatag"></span></div>
        <div class="pb"><div id="chart"></div></div>
      </div>
      <div class="panel">
        <div class="ph"><h3>Posiciones</h3><span class="tag" id="postag"></span></div>
        <div class="pb" style="padding:0">
          <div class="scroll tblwrap"><table id="postbl"></table></div>
        </div>
      </div>
    </div>

    <div class="col">
      <div class="panel">
        <div class="ph"><h3>Riesgo de cartera</h3><span id="verdict"></span></div>
        <div class="pb"><div class="rows" id="risk"></div></div>
      </div>
      <div class="panel">
        <div class="ph"><h3>Reparto por libro</h3></div>
        <div class="pb"><div class="rows" id="books"></div></div>
      </div>
      <div class="panel">
        <div class="ph"><h3>Rendimiento</h3><span class="tag" id="perftag"></span></div>
        <div class="pb"><div class="rows" id="perf"></div></div>
      </div>
    </div>
  </div>

  <div class="panel" style="margin-top:12px">
    <div class="ph"><h3>Noticias en vivo</h3><span class="tag">prensa económica · tickers en cartera</span></div>
    <div class="pb"><div class="news" id="news"></div></div>
  </div>

  <h3 style="margin:18px 0 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)">Monitor de mercado</h3>
  <div class="mkt" id="mkt"></div>

  <div class="foot" id="foot"></div>
</div>

<script>
const DATA = __DATOS__;
const $=(id)=>document.getElementById(id);
const pct=(x,d=2)=>(x==null||isNaN(x))?"—":(x*100>=0?"+":"")+(x*100).toFixed(d)+"%";
const usd=(x)=>(x==null||isNaN(x))?"—":"$"+Math.round(x).toLocaleString("en-US");
const cls=(x)=>x>0?"up":x<0?"down":"muted";
const sgn=(x,d=2)=>(x>=0?"+":"")+x.toFixed(d);

// ---- barra superior
$("clock").textContent = DATA.ts + " Madrid";
const ab = DATA.clock && DATA.clock.abierto;
$("status").innerHTML = ab==null ? "" :
  `<span class="status ${ab?'st-open':'st-closed'}"><span class="led"></span>${ab?'MERCADO ABIERTO':'MERCADO CERRADO'}</span>`;

// ---- cinta
const tape = (DATA.mercado||[]).concat(DATA.mercado||[]).map(m=>
  `<span class="tk"><b>${m.nombre}</b><span class="px">${m.precio.toLocaleString("en-US",{maximumFractionDigits:2})}</span><span class="${cls(m.chg)}">${pct(m.chg)}</span></span>`).join("");
$("tape").innerHTML = tape || "<span class='tk muted'>sin datos de mercado</span>";

// ---- KPIs
const c=DATA.cuenta, rk=DATA.riesgo;
const kpis=[
  {lab:"Equity",val:usd(c.equity),sub:`efectivo ${usd(c.cash)}`,sc:"muted"},
  {lab:"P&L del día",val:pct(c.pl_dia),sub:"sesión actual",sc:cls(c.pl_dia)},
  {lab:"Drawdown",val:pct(c.drawdown),sub:`pico ${usd(c.pico)}`,sc:c.drawdown<-0.0001?"down":"muted"},
  {lab:"VaR 95% · 1d",val:pct(rk.var95_pct),sub:usd(rk.var95_usd),sc:"accent"},
  {lab:"Exposición bruta",val:(rk.bruta||0).toFixed(2)+"x",sub:`${rk.n} posiciones`,sc:"muted"},
  {lab:"Correlación media",val:(rk.corr_media==null||isNaN(rk.corr_media))?"—":sgn(rk.corr_media),sub:rk.corr_media<0.4?"diversificada":"concentrada",sc:rk.corr_media<0.4?"up":"warn"},
];
$("kpis").innerHTML = kpis.map(k=>
  `<div class="kpi"><div class="lab">${k.lab}</div><div class="val ${k.sc}">${k.val}</div><div class="sub muted">${k.sub}</div></div>`).join("");

// ---- gráfico de equity (SVG propio, a escala)
function chart(){
  const curva=DATA.curva||[], spy=DATA.spy||[];
  const box=$("chart");
  if(curva.length<2){box.innerHTML="<div class='muted mono' style='padding:28px 4px'>Historial insuficiente para la curva (se poblará con las sesiones).</div>";return;}
  const W=640,H=230,P={l:46,r:12,t:12,b:22};
  const base=curva[0].equity, norm=curva.map(p=>p.equity/base);
  const sbase=spy.length?spy[0].v:1, snorm=spy.map(p=>p.v/sbase);
  const all=norm.concat(snorm.length?snorm:[1]);
  let lo=Math.min(...all),hi=Math.max(...all); const pad=(hi-lo)*0.15||0.01; lo-=pad;hi+=pad;
  const x=i=>P.l+(W-P.l-P.r)*(i/(curva.length-1));
  const y=v=>P.t+(H-P.t-P.b)*(1-(v-lo)/(hi-lo));
  const line=a=>a.map((v,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(v).toFixed(1)).join(" ");
  const area=line(norm)+` L ${x(norm.length-1).toFixed(1)} ${y(lo).toFixed(1)} L ${x(0).toFixed(1)} ${y(lo).toFixed(1)} Z`;
  let ticks="";for(let g=0;g<=3;g++){const v=lo+(hi-lo)*g/3,yy=y(v).toFixed(1);
    ticks+=`<line class="gridline" x1="${P.l}" y1="${yy}" x2="${W-P.r}" y2="${yy}"/><text x="${P.l-6}" y="${(+yy+3).toFixed(1)}" text-anchor="end" fill="var(--faint)" font-size="10" font-family="var(--mono)">${((v-1)*100).toFixed(1)}%</text>`;}
  const ex=x(norm.length-1),ey=y(norm[norm.length-1]);
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Curva de equity">
    <defs><linearGradient id="fill" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="var(--chart)" stop-opacity=".28"/><stop offset="1" stop-color="var(--chart)" stop-opacity="0"/></linearGradient></defs>
    ${ticks}
    ${snorm.length?`<path d="${line(snorm)}" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="4 3" opacity=".8"/>`:""}
    <path d="${area}" fill="url(#fill)"/>
    <path d="${line(norm)}" fill="none" stroke="var(--chart)" stroke-width="2"/>
    <circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="3.5" fill="var(--chart)"/>
  </svg>`;
  $("curvatag").textContent=`${curva.length} sesiones · cuenta vs SPY (— —)`;
}
chart();

// ---- posiciones
const pos=DATA.posiciones||[];
$("postag").textContent=`${pos.length} · bruta ${(rk.bruta||0).toFixed(2)}x`;
$("postbl").innerHTML=`<thead><tr><th>Ticker</th><th>Libro</th><th>Cant.</th><th>Precio</th><th>Valor</th><th>Peso</th><th>P&L</th></tr></thead><tbody>`+
 (pos.length?pos.map(p=>`<tr><td><b>${p.ticker}</b></td><td><span class="bk">${p.libro.replace('sin_clasificar','s/c')}</span></td>
   <td>${p.qty}</td><td>${p.precio?p.precio.toFixed(2):"—"}</td><td>${usd(p.valor)}</td><td>${pct(p.peso,1)}</td>
   <td class="${cls(p.pl)}">${sgn(p.pl,0).replace('+','+$').replace('-','-$')}</td></tr>`).join("")
   :`<tr><td colspan="7" class="muted" style="padding:16px">Sin posiciones abiertas.</td></tr>`)+`</tbody>`;

// ---- riesgo
const rows=(arr)=>arr.map(r=>`<div class="row"><span class="k">${r[0]}</span><span class="v ${r[2]||''}">${r[1]}</span></div>`).join("");
$("verdict").innerHTML=`<span class="pill p-${rk.decision}"><span class="led"></span>${rk.decision}</span>`;
$("risk").innerHTML=rows([
  ["VaR 95% (1 día)",pct(rk.var95_pct)+" · "+usd(rk.var95_usd),"accent"],
  ["Vol diaria cartera",pct(rk.vol_diaria),""],
  ["Exposición neta",(rk.neta||0).toFixed(2)+"x",""],
  ["Posición mayor",pct(rk.peso_max,1),rk.peso_max>0.25?"warn":""],
  ["Concentración (HHI)",(rk.hhi||0).toFixed(3),""],
])+`<div class="row" style="margin-top:4px"><span class="k muted" style="font-size:11px">${(rk.razones||[]).join("; ")}</span></div>`;

// ---- libros
const libs=DATA.libros||[]; const bt=libs.reduce((s,l)=>s+l.bruta,0)||1;
$("books").innerHTML=libs.length?libs.map(l=>{const sh=l.bruta/bt;
  return `<div><div class="row"><span class="k">${l.libro.replace('sin_clasificar','sin clasificar')} <span class="muted">· ${l.n}</span></span>
   <span class="v ${cls(l.pl)}">${sgn(l.pl,0).replace('+','+$').replace('-','-$')}</span></div>
   <div class="bar"><i style="width:${(sh*100).toFixed(0)}%"></i></div></div>`}).join("")
  :`<div class="muted mono">Sin posiciones.</div>`;

// ---- rendimiento
const ts=DATA.tearsheet||{}, op=DATA.ops||{};
$("perftag").textContent = ts.insuficiente?`${ts.n||0} sesiones`:"tear-sheet";
let perf;
if(ts.insuficiente){
  perf=[["Tear-sheet","muestra insuficiente","muted"],["Sesiones",String(ts.n||0),""]];
}else{
  perf=[["Sharpe",sgn(ts.sharpe),ts.sharpe>0?"up":"down"],["Sortino",sgn(ts.sortino),""],
        ["Calmar",sgn(ts.calmar),""],["Max drawdown",pct(ts.max_drawdown),"down"],["CAGR",pct(ts.cagr),cls(ts.cagr)]];
}
perf=perf.concat([
  ["Operaciones cerradas",String(op.n||0),""],
  ["Hit-rate",op.n?pct(op.hit_rate,0):"—",op.hit_rate>=0.5?"up":"warn"],
  ["Profit factor",op.n?(op.profit_factor||0).toFixed(2):"—",op.profit_factor>=1?"up":"down"],
  ["Slippage medio",op.slippage_bps==null?"—":sgn(op.slippage_bps,1)+" bps",op.slippage_bps>5?"warn":"up"],
]);
$("perf").innerHTML=rows(perf);

// ---- noticias
const nw=DATA.noticias||[];
$("news").innerHTML=nw.length?nw.map(n=>{
  const col=n.punt>0.1?"var(--up)":n.punt<-0.1?"var(--down)":"var(--muted)";
  const host=n.url?(()=>{try{return new URL(n.url).hostname.replace("www.","")}catch(e){return ""}})():"";
  const tt=n.url?`<a href="${n.url}" target="_blank" rel="noopener">${n.titular}</a>`:n.titular;
  return `<div class="ni"><span class="sdot" style="background:${col}"></span><div style="min-width:0">
    <div class="tt">${tt}</div>
    <div class="mt"><span class="sym">${n.ticker}</span><span>${n.fuente||host||"—"}</span><span>${n.fecha||""}</span></div></div></div>`;
}).join(""):`<div class="muted mono">Sin titulares recientes.</div>`;

// ---- monitor de mercado
$("mkt").innerHTML=(DATA.mercado||[]).map(m=>
  `<div class="mcell"><div class="n">${m.nombre}</div>
   <div class="p">${m.precio.toLocaleString("en-US",{maximumFractionDigits:2})}</div>
   <div class="c ${cls(m.chg)}">${pct(m.chg)}</div></div>`).join("");

$("foot").textContent=`Ilegalísimo Terminal · cuenta PAPER (nunca dinero real) · datos Alpaca + Yahoo · generado ${DATA.ts} Madrid`;
</script>
